name = "baby-dashboard"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-25"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
# Environment variable bindings for Pages Functions
# Set these in Cloudflare Pages dashboard for Production; local dev can override via CLI flags
# MONGODB_URI is no longer needed
# VITE_GOOGLE_CLIENT_ID

[[d1_databases]]
binding = "DB" # Available in your Worker on env.DB
database_name = "baby-dashboard-db"
database_id = "6903a714-74a6-4ffd-b357-672480041d87" # baby-dashboard-db